# Generated by tools/generate_struggle_configs.py -- do not edit by hand.
dataset_name: struggle
train_split: ['train_attempt01']
val_split: ['validation']
dataset: {
  json_file: ../data/EvoStruggle/splits/separate_attempts/Tying_Knots/Tying_Knots_sepattempt.json,
  feat_folder: ../data/EvoStruggle/extracted_features/slowfast_features/Tying_Knots,
  # activity name choose from [Tying_Knots, Origami, Shuffle_Cards, Tangram]
  file_ext: .npy,
  file_prefix: ~,
  # file_prefix are not used in the struggle dataset
  num_classes: 1,
  # num_classes 0 for Struggle, 1 for Non-struggle
  input_dim: 2304,
  feat_stride: 16,
  num_frames: 32,
  # serve as data augmentation
  trunc_thresh: 0.5,
  crop_ratio: [0.9, 1.0],
  max_seq_len: 192,
  # max_seq_len must be divisible by (n_mha_win_size + 1)
}
model: {
  fpn_type: identity,
  max_buffer_len_factor: 6.0,
  n_mha_win_size: 7,
}
opt: {
  learning_rate: 0.0001,
  epochs: 30,
  weight_decay: 0.05,
  schedule_type: cosine,
  schedule_steps: []
}
loader: {
  batch_size: 8,
}
train_cfg: {
  init_loss_norm: 100,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,
}
test_cfg: {
  voting_thresh: 0.7,
  pre_nms_topk: 10,
  max_seg_num: 10,
  min_score: 0.001,
  # when using external scores, our model is generating "proposals"
  # multiclass_nms: False,
  # ext_score_file: ./data/thumos/annotations/thumos14_cls_scores.pkl,
  # comment out L47-48 and uncomment L50 to disable score fusion
  multiclass_nms: True,
}
output_folder: ./ckpt/

